name: Security Exception Lifecycle

on:
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  verify:
    name: Verify dismissed alert exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Re-evaluate registered exceptions
        run: node scripts/security-exception.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
