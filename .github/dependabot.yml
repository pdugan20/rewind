version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
      time: '07:10'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: '07:20'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /apex-worker
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:40'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
