version: 2
updates:
  - package-ecosystem: npm
    cooldown: { default-days: 7 }
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    cooldown: { default-days: 7 }
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
      time: '07:10'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    cooldown: { default-days: 7 }
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: '07:20'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    cooldown: { default-days: 7 }
    directory: /apex-worker
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    cooldown: { default-days: 14 }
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:40'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
